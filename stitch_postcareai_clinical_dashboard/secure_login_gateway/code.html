<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PostCareAI - Secure Access Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#dc2626",
                        "surface-container-highest": "#2f3542",
                        "on-surface-variant": "#e6bdb8",
                        "tertiary-container": "#008075",
                        "on-secondary-fixed-variant": "#653e00",
                        "surface-container-high": "#242a36",
                        "on-primary-container": "#fff6f5",
                        "on-error": "#690005",
                        "background": "#0e131f",
                        "on-surface": "#dde2f3",
                        "on-tertiary-fixed-variant": "#005049",
                        "outline-variant": "#5c403c",
                        "surface-container-lowest": "#080e1a",
                        "secondary-fixed": "#ffddb8",
                        "tertiary-fixed-dim": "#6bd8cb",
                        "secondary-container": "#ee9800",
                        "secondary-fixed-dim": "#ffb95f",
                        "on-primary-fixed-variant": "#93000b",
                        "surface": "#0e131f",
                        "surface-variant": "#2f3542",
                        "on-primary": "#690005",
                        "error-container": "#93000a",
                        "inverse-primary": "#bf0715",
                        "tertiary": "#6bd8cb",
                        "tertiary-fixed": "#89f5e7",
                        "on-secondary": "#472a00",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#00201d",
                        "on-tertiary-container": "#ddfff9",
                        "on-tertiary": "#003732",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#dde2f3",
                        "outline": "#ac8884",
                        "surface-container": "#1a202c",
                        "primary-fixed-dim": "#ffb4ab",
                        "on-secondary-container": "#5b3800",
                        "on-background": "#dde2f3",
                        "secondary": "#ffb95f",
                        "surface-dim": "#0e131f",
                        "surface-tint": "#ffb4ab",
                        "primary": "#ffb4ab",
                        "inverse-on-surface": "#2b303d",
                        "primary-fixed": "#ffdad6",
                        "on-primary-fixed": "#410002",
                        "on-secondary-fixed": "#2a1700",
                        "surface-container-low": "#161c28",
                        "surface-bright": "#343946"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "margin-desktop": "40px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "data-display": ["JetBrains Mono"],
                        "data-label": ["JetBrains Mono"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "data-display": ["18px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "data-label": ["12px", { "lineHeight": "1", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md overflow-hidden relative selection:bg-tertiary selection:text-on-tertiary">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/5 rounded-full blur-[128px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-tertiary/5 rounded-full blur-[128px]"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-md px-margin-mobile z-10 relative">
<div class="bg-surface-container-high/80 backdrop-blur-xl border border-surface-bright p-8 rounded-xl shadow-2xl flex flex-col gap-6 relative overflow-hidden group">
<!-- Subtle Top Glow -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-tertiary/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
<!-- Header -->
<div class="flex flex-col items-center text-center gap-3">
<img alt="PostCareAI Brand Icon" class="h-12 w-12 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtmLfHTPNXWc7HiQfP-kPsf8hLuW45qwYy4AgTqK3nq8j9UE9XpHguRFWPO6KRIF51PoYJuAT3ho96anrJp6g_A1kpfqYrs61WvVgs4nNBiKd5wk8Sngsi-quCJe9oWfa-lCHpTfzA2q047UjTqUKlD2L3ocOAK7D6PA5kia3HjaCXz-erItzdBPLOyv2iOLw5dCJPWrlu2vTsQLNvjLcSJfA5P5jRNIECX5XFxI3HP8yBTa_dlUDZEZiI"/>
<div>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-on-surface">POSTCARE<span class="text-primary">AI</span></h1>
<p class="text-on-surface-variant font-data-label text-data-label uppercase tracking-widest mt-1 opacity-80">Secure Access Portal</p>
</div>
</div>
<!-- Role Selector -->
<div class="flex bg-surface-container-highest p-1 rounded-lg border border-surface-bright">
<button class="flex-1 py-2 text-center rounded-md font-data-label text-data-label uppercase tracking-wider transition-all duration-200 bg-tertiary/10 border border-tertiary/30 text-tertiary shadow-[0_0_10px_rgba(107,216,203,0.1)]">
                    Patient
                </button>
<button class="flex-1 py-2 text-center rounded-md font-data-label text-data-label uppercase tracking-wider transition-all duration-200 text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/50">
                    Clinician
                </button>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Input: ID -->
<div class="flex flex-col gap-2 relative">
<label class="font-data-label text-data-label text-on-surface-variant flex items-center justify-between" for="patient-id">
<span>Patient ID / Email</span>
<span class="material-symbols-outlined text-[14px] opacity-50">badge</span>
</label>
<div class="relative">
<input autocomplete="username" class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-data-display text-data-display px-4 py-3 rounded focus:border-tertiary focus:ring-1 focus:ring-tertiary/50 outline-none transition-colors placeholder-on-surface-variant/30" id="patient-id" placeholder="A-12490-X" type="text"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<div class="w-2 h-2 rounded-full bg-error animate-pulse hidden" id="id-error-indicator"></div>
</div>
</div>
</div>
<!-- Input: PIN -->
<div class="flex flex-col gap-2">
<label class="font-data-label text-data-label text-on-surface-variant flex items-center justify-between" for="access-pin">
<span>Access PIN / Password</span>
<span class="material-symbols-outlined text-[14px] opacity-50">password</span>
</label>
<input autocomplete="current-password" class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-data-display text-[24px] tracking-[0.2em] px-4 py-3 rounded focus:border-tertiary focus:ring-1 focus:ring-tertiary/50 outline-none transition-colors" id="access-pin" placeholder="••••••••" type="password"/>
</div>
<!-- Utility Row -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer group/cb">
<div class="relative flex items-center justify-center">
<input class="appearance-none w-4 h-4 rounded-sm border border-outline-variant bg-surface-container-lowest checked:bg-tertiary checked:border-tertiary transition-colors cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[12px] text-on-tertiary opacity-0 pointer-events-none" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-data-label text-data-label text-on-surface-variant group-hover/cb:text-on-surface transition-colors">Remember device</span>
</label>
<a class="font-data-label text-data-label text-tertiary hover:text-tertiary-fixed hover:underline transition-colors flex items-center gap-1" href="#">
                        Forgot ID/PIN?
                        <span class="material-symbols-outlined text-[14px]">help</span>
</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-tertiary hover:bg-tertiary-fixed text-on-tertiary font-headline-md text-headline-md !text-[16px] py-3 rounded-lg transition-all duration-200 mt-2 flex items-center justify-center gap-2 active:scale-[0.98] shadow-[0_0_15px_rgba(107,216,203,0.15)] hover:shadow-[0_0_25px_rgba(107,216,203,0.3)]" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock</span>
                    Secure Login
                </button>
</form>
</div>
</main>
<!-- Footer -->
<footer class="absolute bottom-6 w-full text-center z-10 px-4">
<p class="font-data-label text-data-label text-on-surface-variant/60 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[14px] text-tertiary/70">shield</span>
            HIPAA Compliant Connection - End-to-End Encrypted.
        </p>
</footer>
<style>
        /* Custom Checkbox Logic */
        input[type="checkbox"]:checked + span {
            opacity: 1;
        }
        
        /* Autofill overrides for dark theme */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #080e1a inset !important;
            -webkit-text-fill-color: #dde2f3 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
<script>
        // Simple micro-interaction: focus effects
        const inputs = document.querySelectorAll('input[type="text"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', (e) => {
                e.target.parentElement.previousElementSibling.classList.add('text-tertiary');
                e.target.parentElement.previousElementSibling.classList.remove('text-on-surface-variant');
            });
            input.addEventListener('blur', (e) => {
                e.target.parentElement.previousElementSibling.classList.remove('text-tertiary');
                e.target.parentElement.previousElementSibling.classList.add('text-on-surface-variant');
            });
        });
    </script>
</body></html>
